<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bordenergie</title>
<style>
:root{--bg:#0f1216;--card:#181d24;--fg:#e8ecf1;--mut:#8a94a3;--ok:#2fbf71;--warn:#f0b429;--bad:#ef4b4b;--acc:#3b9cff;--line:#2a313b}
@media(prefers-color-scheme:light){:root{--bg:#f2f4f7;--card:#fff;--fg:#14181f;--mut:#667085;--line:#e1e5eb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.3 system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
header h1{font-size:16px;margin:0;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok)}
button{font:inherit;border:0;border-radius:8px;padding:8px 12px;color:#fff;background:var(--acc);cursor:pointer}
button.pause{background:var(--ok)}button.stop{background:var(--bad)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card h2{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{color:var(--mut);font-weight:400}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.big div{text-align:center}.big b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.big span{color:var(--mut);font-size:11px}
.soc{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 8px}.soc i{display:block;height:100%;background:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(3,auto 1fr);gap:4px 6px;font-size:12.5px;align-items:baseline}.kv span{color:var(--mut);white-space:nowrap}.kv b{font-weight:500;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.chip{padding:3px 8px;border-radius:999px;font-size:12px;background:var(--line)}
.chip.ok{background:rgba(47,191,113,.18);color:var(--ok)}.chip.bad{background:rgba(239,75,75,.18);color:var(--bad)}.chip.warn{background:rgba(240,180,41,.18);color:var(--warn)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px 8px;margin-top:6px}
.cell{font-size:11.5px;font-variant-numeric:tabular-nums}.cell .bar{height:5px;background:var(--line);border-radius:3px;margin-top:2px;overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--acc)}.cell.min .bar i{background:var(--warn)}.cell.max .bar i{background:var(--ok)}
.cell.bal{outline:1px dashed var(--acc);outline-offset:2px;border-radius:3px}
.alarms{margin-top:8px;font-size:12.5px}.alarms div{padding:3px 0;color:var(--bad)}.alarms .warn{color:var(--warn)}
.stale{opacity:.5}.hint{color:var(--mut);font-size:12px;padding:0 12px 10px}
</style></head><body>
<header><span class="dot" id="dot"></span><h1>Bordenergie <small id="mode" style="color:var(--mut);font-weight:400"></small></h1>
<button id="btn">…</button></header>
<main id="main"></main>
<div class="hint" id="hint"></div>
<script>
const PLUGIN='/plugins/signalk-daly-companion', LABELS={};
const st={}, E={}, notes={}; let paused=false, until=null, cfg={pauseMinutes:30}, banks=[], solarHist={};
const $=id=>document.getElementById(id);
const K=273.15, f=(v,d=2)=>typeof v==='number'?v.toFixed(d):'–';
function get(id,p){const o=st[id]||{};return o[p]}
const kwh=v=>v>=1000?(v/1000).toFixed(2)+' kWh':v+' Wh'; const todayKey=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const ev=(p,max=90000)=>{const e=E[p];return e&&Date.now()-e.t<max?e.v:undefined};
function energyCard(){
  const solar=Object.keys(E).filter(k=>/^electrical\.solar\.[^.]+\.panelPower$/.test(k)).map(k=>k.split('.')[2]);
  const shunt=ev('electrical.batteries.shunt.voltage')!==undefined;
  if(!solar.length&&!shunt) return '';
  let pv=0,out=0,rows='';
  for(const id of solar){
    const b=`electrical.solar.${id}.`, w=ev(b+'panelPower'), a=ev(b+'current'), v=ev(b+'voltage'), y=ev(b+'yieldToday',3600e3), m=ev(b+'chargingMode');
    if(typeof w==='number') pv+=w; if(typeof a==='number'&&typeof v==='number') out+=a*v;
    rows+=`<span>${id.toUpperCase()}</span><b>${f(w,0)} W · ${f(a,1)} A</b><span>${m||'–'}${typeof y==='number'?' · heute '+(y/3600).toFixed(0)+' Wh':''}</span>`;
    const hist=(solarHist[id]||[]).filter(d=>d.date!==todayKey()).slice(-3);
    if(hist.length){ const best=hist.reduce((a,b)=>b.wh>a.wh?b:a);
      rows+=`<span>letzte ${hist.length} T</span><b>${hist.map(d=>`${d.date.slice(8,10)}.${d.date.slice(5,7)}. ${kwh(d.wh)}`).join(' · ')}</b><span>max ${kwh(best.wh)} (${best.date.slice(8,10)}.${best.date.slice(5,7)}., Spitze ${best.peakW} W)</span>`; }
  }
  const sv=ev('electrical.batteries.shunt.voltage'), sa=ev('electrical.batteries.shunt.current'), sw=ev('electrical.batteries.shunt.power'), ssoc=ev('electrical.batteries.shunt.capacity.stateOfCharge'), tr=ev('electrical.batteries.shunt.capacity.timeRemaining',600e3);
  const load=(solar.length&&typeof sw==='number')?Math.max(0,out-sw):undefined;
  const om=ev('electrical.converters.orion.chargingMode')??ev('electrical.chargers.orion.chargingMode'), oin=ev('electrical.converters.orion.input.voltage')??ev('electrical.chargers.orion.input.voltage');
  const trs=typeof tr==='number'?(tr>=864000?'>10 d':tr>=86400?(tr/86400).toFixed(1)+' d':(tr/3600).toFixed(1)+' h'):'–';
  return `<section class="card"><h2>Energie 24 V<small>SmartShunt · Victron</small></h2>
  <div class="big"><div><b style="color:var(--ok)">${f(pv,0)}</b><span>W Solar</span></div><div><b style="color:${typeof sw==='number'&&sw<0?'var(--warn)':'var(--fg)'}">${typeof sw==='number'?(sw>0?'+':'')+sw.toFixed(0):'–'}</b><span>W Batterie</span></div><div><b>${f(load,0)}</b><span>W Verbrauch</span></div><div><b>${ssoc!=null?(ssoc*100).toFixed(0):'–'}</b><span>% SOC Shunt</span></div></div>
  <div class="soc"><i style="width:${ssoc!=null?ssoc*100:0}%;background:${ssoc<0.2?'var(--bad)':ssoc<0.3?'var(--warn)':'var(--ok)'}"></i></div>
  <div class="kv">${rows}<span>Shunt</span><b>${f(sv)} V · ${f(sa,1)} A</b><span>Restzeit ${trs}</span>
  <span>Orion 24→12</span><b>${om||'–'}</b><span>${typeof oin==='number'?'Eingang '+f(oin)+' V':''}</span></div></section>`;
}
function render(){
  const main=$('main'); let html='';
  for(const id of banks){
    const g=p=>get(id,p), v=g('voltage'), a=g('current'), w=g('power'), soc=g('capacity.stateOfCharge');
    const ts=get(id,'_ts')||0, stale=Date.now()-ts>60000;
    const cells=Object.entries(st[id]||{}).filter(([k])=>/^cells\.\d+\.voltage$/.test(k)).map(([k,val])=>[+k.split('.')[1],val]).sort((x,y)=>x[0]-y[0]);
    const minC=g('cells.minimumCell'), maxC=g('cells.maximumCell'), bal=g('bms.balancing')||[];
    const lo=Math.min(...cells.map(c=>c[1]),3.0), hi=Math.max(...cells.map(c=>c[1]),3.6);
    const temps=Object.entries(st[id]||{}).filter(([k])=>/^temperatures\./.test(k)).map(([k,val])=>`${k.split('.')[1]}: ${f(val-K,1)} °C`);
    const errs=g('bms.errors')||[]; const nts=Object.entries(notes).filter(([k])=>k.startsWith(id+'.')).filter(([,n])=>n.state!=='normal');
    const chip=(on,t,f2)=>`<span class="chip ${on===undefined?'':on?'ok':f2||'bad'}">${t}${on===undefined?'':on?' ein':' aus'}</span>`;
    html+=`<section class="card ${stale?'stale':''}"><h2>${LABELS[id]||id}<small>${g('bms.mode')||''}${stale?' · keine Daten':''}</small></h2>
    <div class="big"><div><b>${f(v)}</b><span>V</span></div><div><b>${f(a,1)}</b><span>A</span></div><div><b>${f(w,0)}</b><span>W</span></div><div><b>${soc!=null?(soc*100).toFixed(0):'–'}</b><span>% SOC</span></div></div>
    <div class="soc"><i style="width:${soc!=null?soc*100:0}%;background:${soc<0.2?'var(--bad)':soc<0.3?'var(--warn)':'var(--ok)'}"></i></div>
    <div class="kv"><span>Rest</span><b>${f(g('bms.remainingCapacity'),1)} Ah</b><span>Zyklen</span><b>${g('bms.cycles')??'–'}</b><span>Zellen</span><b>${g('bms.cellCount')??cells.length}</b>
    <span>Δ Zelle</span><b>${g('cells.deltaVoltage')!=null?(g('cells.deltaVoltage')*1000).toFixed(0)+' mV':'–'}</b><span>T max</span><b>${g('bms.maximumTemperature')!=null?f(g('bms.maximumTemperature')-K,1)+' °C':'–'}</b><span>T min</span><b>${g('bms.minimumTemperature')!=null?f(g('bms.minimumTemperature')-K,1)+' °C':'–'}</b></div>
    <div class="chips">${chip(g('bms.chargeMosfet'),'Laden')}${chip(g('bms.dischargeMosfet'),'Entladen')}${chip(g('bms.balancingActive'),'Balancing','warn')}${temps.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
    <div class="cells">${cells.map(([n,cv])=>`<div class="cell ${n===minC?'min':''} ${n===maxC?'max':''} ${bal.includes(n)?'bal':''}"><span>${n}</span> <b>${(cv*1000).toFixed(0)}</b><div class="bar"><i style="width:${Math.max(4,(cv-lo)/(hi-lo||1)*100)}%"></i></div></div>`).join('')}</div>
    <div class="alarms">${errs.map(e=>`<div>⚠ ${e}</div>`).join('')}${nts.map(([,n])=>`<div class="${n.state}">${n.state==='alarm'?'⚠':'•'} ${n.message||''}</div>`).join('')}</div></section>`;
  }
  html=energyCard()+html;
  main.innerHTML=html||'<p class="hint">Keine Bänke in der Daly-Plugin-Konfiguration.</p>';
  $('btn').textContent=paused?`App-Modus beenden (${Math.max(0,Math.round((new Date(until)-Date.now())/60000))} min)`:`Daly-App-Modus (${cfg.pauseMinutes} min)`;
  $('btn').className=paused?'stop':'pause';
  $('mode').textContent=paused?'· pausiert, Bluetooth frei für Daly-App':'';
}
async function loadStatus(){
  const r=await fetch(PLUGIN+'/status').then(r=>r.json());
  paused=r.paused; until=r.until; cfg=r; banks=r.batteries.map(b=>b.id); r.batteries.forEach(b=>LABELS[b.id]=b.label); solarHist=r.solar||{}; render();
}
$('btn').onclick=async()=>{ $('btn').disabled=true; await fetch(PLUGIN+(paused?'/resume':'/pause')+'?format=json'); await loadStatus(); $('btn').disabled=false; };
function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/signalk/v1/stream?subscribe=none');
  ws.onopen=()=>{ $('dot').className='dot on'; ws.send(JSON.stringify({context:'vessels.self',subscribe:[{path:'electrical.*',period:1000},{path:'notifications.electrical.batteries.*',period:1000}]})); };
  ws.onclose=()=>{ $('dot').className='dot'; setTimeout(connect,3000); };
  ws.onmessage=e=>{ const m=JSON.parse(e.data); if(!m.updates) return;
    for(const u of m.updates) for(const {path,value} of (u.values||[])){
      E[path]={v:value,t:Date.now()};
      let mm=path.match(/^electrical\.batteries\.([^.]+)\.(.+)$/);
      if(mm){ (st[mm[1]]=st[mm[1]]||{})[mm[2]]=value; st[mm[1]]._ts=Date.now(); if(!banks.includes(mm[1])&&!/^daly/.test(mm[1])&&mm[2]==='voltage'&&LABELS[mm[1]]) banks.push(mm[1]); continue; }
      if(path==='electrical.batteries.dalyAppMode'){ paused=!!value; }
      if(path==='electrical.batteries.dalyAppModeUntil'){ until=value; }
      mm=path.match(/^notifications\.electrical\.batteries\.(.+)$/); if(mm) notes[mm[1]]=value||{state:'normal'};
    } render(); };
}
loadStatus().then(connect); setInterval(render,10000); setInterval(loadStatus,120000);
$('hint').textContent='Lesezeichen für den App-Modus: '+location.origin+PLUGIN+'/pause  ·  Ansicht: '+location.origin+'/signalk-daly-companion/';
</script></body></html>
